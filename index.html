<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>منصة تحصيلي مبكر في الفيزياء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: RTL single-column app, centered 880px shell; home = hero strip + stage grid + side-by-side leaderboard; quiz = one question card with a numbered navigator. */
:root{
  --bg:#EDF2F7; --surface:#FFFFFF; --ink:#12223A; --muted:#566880; --line:#D3DCE8;
  --brand:#0B6E7F; --brand-ink:#FFFFFF; --brand-soft:#DCEFF2;
  --gold:#B87A00; --gold-bg:#FBF0D3;
  --ok:#17794A; --ok-bg:#DDF3E6; --bad:#B3261E; --bad-bg:#FBE1DE;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#14233A; --ink:#E7EEF7; --muted:#9FB2C8; --line:#27374F;
  --brand:#45C3D6; --brand-ink:#05222A; --brand-soft:#123446;
  --gold:#F2B93B; --gold-bg:#3A2D0E;
  --ok:#5AD18F; --ok-bg:#11321F; --bad:#FF8F85; --bad-bg:#3B1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#14233A; --ink:#E7EEF7; --muted:#9FB2C8; --line:#27374F;
  --brand:#45C3D6; --brand-ink:#05222A; --brand-soft:#123446;
  --gold:#F2B93B; --gold-bg:#3A2D0E;
  --ok:#5AD18F; --ok-bg:#11321F; --bad:#FF8F85; --bad-bg:#3B1714; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
.shell{max-width:880px;margin-inline:auto;padding-block:16px 48px}
.disp{font-family:var(--f-display);text-wrap:balance}
.topbar{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar h1{font-size:1.35rem;line-height:1.3;margin:0}
.topbar p{margin:0;font-size:.88rem;opacity:.92}
.teacher{display:inline-block;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:1px 12px;font-weight:700;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 18px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.98rem;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn-gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input{font-family:inherit;font-size:1rem;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--bg);color:var(--ink)}
input:focus{border-color:var(--brand);outline:none}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;font-size:1rem;line-height:1.6;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .l{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.dir-ltr{direction:ltr;unicode-bidi:isolate}
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.dot{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.dot.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2.5px solid var(--brand);outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:.82rem;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.gold{background:var(--gold-bg);color:var(--gold)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage.locked{opacity:.55}
.num{font-variant-numeric:tabular-nums}
.fb{border-radius:12px;padding:12px 14px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.9rem}
textarea{width:100%;min-height:150px;font-family:var(--f-body);font-size:.88rem;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.cert{border:3px double var(--gold);border-radius:20px;padding:28px 18px;text-align:center;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar"></div>
<div id="toast" class="toast" hidden><span></span></div>

<script>
const QB={};
// الاختبار التشخيصي: 20 سؤالًا. الخيار الأول في o هو الصحيح دائمًا ويُخلط عند العرض.
QB.diag = [
{d:1,q:"أي العبارات التالية تصف كمية متجهة؟",o:["سقوط حجر رأسيًا إلى الأسفل بسرعة 9 m/s","سيارة تسير بسرعة 30 km/h","سباح قطع مسافة 800 m","كتلة جسم مقدارها 5 kg"],e:"الكمية المتجهة تحتاج مقدارًا واتجاهًا معًا. الخيار الأول حدد الاتجاه (إلى الأسفل) مع المقدار، أما بقية الخيارات فهي مقادير فقط (كميات قياسية)."},
{d:1,q:"6 μm تساوي بوحدة المتر:",o:["6×10⁻⁶","6×10⁶","6×10⁻⁹","6×10⁹"],e:"البادئة ميكرو (μ) تعني 10⁻⁶، فيكون 6 μm = 6×10⁻⁶ m."},
{d:1,q:"دراجة سرعتها 10 m/s، فكم سرعتها بوحدة km/h؟",o:["36","12","1.2","360"],e:"للتحويل من m/s إلى km/h نضرب في 3.6: 10 × 3.6 = 36 km/h."},
{d:1,q:"معدل تغير السرعة بالنسبة للزمن يسمى:",o:["التسارع","السرعة المتوسطة","المسافة","السرعة اللحظية"],e:"التسارع a = Δv / Δt، أي مقدار التغير في السرعة في وحدة الزمن."},
{d:1,q:"سقط حجر سقوطًا حرًا من السكون، فإن سرعته بعد 5 s تساوي (g = 9.8 m/s²):",o:["49 m/s","35 m/s","13 m/s","24 m/s"],e:"v = g·t = 9.8 × 5 = 49 m/s."},
{d:1,q:"أثرت قوة مقدارها 100 N على جسم كتلته 20 kg وحركته في اتجاه القوة، فإن تسارعه بوحدة m/s² يساوي:",o:["5","0.2","2","9.8"],e:"قانون نيوتن الثاني: a = F / m = 100 ÷ 20 = 5 m/s²."},
{d:2,q:"الوحدة kg·m/s² تكافئ وحدة:",o:["النيوتن","الجول","الواط","الباسكال"],e:"F = m·a، فوحدة القوة kg·m/s² وهي النيوتن (N)."},
{d:1,q:"جسم كتلته 2 kg على ارتفاع 5 m عن سطح الأرض، فإن طاقة وضعه الجذبية تساوي (g = 10 m/s²):",o:["100 J","10 J","50 J","200 J"],e:"PE = m·g·h = 2 × 10 × 5 = 100 J."},
{d:1,q:"جسم كتلته 4 kg يتحرك بسرعة 3 m/s، فإن طاقته الحركية تساوي:",o:["18 J","12 J","36 J","6 J"],e:"KE = ½·m·v² = 0.5 × 4 × 9 = 18 J."},
{d:1,q:"درجة الحرارة 100 K تساوي على مقياس السلسيوس:",o:["−173 °C","173 °C","−100 °C","−200 °C"],e:"T(°C) = T(K) − 273 = 100 − 273 = −173 °C."},
{d:1,q:"مقاومة مقدارها 5 Ω يمر فيها تيار 2 A، فإن فرق الجهد بين طرفيها يساوي:",o:["10 V","2.5 V","7 V","0.4 V"],e:"قانون أوم: V = I·R = 2 × 5 = 10 V."},
{d:1,q:"عند تقريب القطب الشمالي لمغناطيس من القطب الشمالي لمغناطيس آخر فإنهما:",o:["يتنافران","يتجاذبان","لا يتأثران","يفقدان مغناطيسيتهما"],e:"الأقطاب المتشابهة تتنافر والأقطاب المختلفة تتجاذب."},
{d:1,q:"تبلغ سرعة الضوء في الفراغ تقريبًا:",o:["3×10⁸ m/s","3×10⁶ m/s","340 m/s","3×10⁵ m/s"],e:"سرعة الضوء في الفراغ c ≈ 3×10⁸ m/s، وهي أقصى سرعة في الكون."},
{d:1,q:"سقط شعاع ضوئي على مرآة مستوية بزاوية سقوط 30°، فإن زاوية الانعكاس تساوي:",o:["30°","60°","15°","0°"],e:"قانون الانعكاس: زاوية السقوط = زاوية الانعكاس، وتقاس كلتاهما من العمود المقام على السطح."},
{d:2,q:"انتقال الإلكترون في ذرة الهيدروجين من مستوى الطاقة 4 إلى المستوى 2 ينتج:",o:["إشعاعًا في سلسلة بالمر (ضوء مرئي)","إشعاعًا في سلسلة ليمان (فوق بنفسجي)","إشعاعًا في سلسلة باشن (تحت حمراء)","طيف امتصاص"],e:"الانتقال إلى المستوى n = 2 يعطي سلسلة بالمر وتقع خطوطها في المنطقة المرئية. وبما أن الإلكترون ينتقل لمستوى أقل طاقة فالطيف انبعاث وليس امتصاصًا."},
{d:1,q:"تتحرك سيارة من السكون بتسارع ثابت 2 m/s² لمدة 5 s، فتكون سرعتها النهائية:",o:["10 m/s","7 m/s","2.5 m/s","25 m/s"],e:"v = v₀ + a·t = 0 + 2 × 5 = 10 m/s."},
{d:1,q:"قطع شخص 360 m في مسار دائري وعاد إلى نقطة بدايته، فأي العبارات صحيحة؟",o:["الإزاحة 0 والمسافة 360 m","الإزاحة 360 m والمسافة 0","الإزاحة 360 m والمسافة 360 m","الإزاحة 0 والمسافة 0"],e:"الإزاحة هي التغير في الموضع بين البداية والنهاية فتساوي صفرًا، أما المسافة فهي طول المسار الكلي 360 m."},
{d:2,q:"أي العبارات التالية تصف قانون نيوتن الثالث؟",o:["قوتا الفعل ورد الفعل متساويتان مقدارًا ومتعاكستان اتجاهًا وتؤثران في جسمين مختلفين","قوتا الفعل ورد الفعل تؤثران في الجسم نفسه فتتعادلان","قوة الفعل أكبر دائمًا من قوة رد الفعل","الجسم الساكن لا يتأثر بأي قوة"],e:"قوتا الفعل ورد الفعل تؤثران في جسمين مختلفين، لذلك لا تلغي إحداهما الأخرى رغم تساويهما في المقدار وتعاكسهما في الاتجاه."},
{d:1,q:"جسم كتلته 2 kg يتحرك بسرعة 5 m/s، فإن زخمه الخطي يساوي:",o:["10 kg·m/s","2.5 kg·m/s","25 kg·m/s","7 kg·m/s"],e:"الزخم p = m·v = 2 × 5 = 10 kg·m/s."},
{d:2,q:"محرك يبذل شغلًا مقداره 600 J خلال 20 s، فإن قدرته تساوي:",o:["30 W","12000 W","3 W","580 W"],e:"القدرة P = W / t = 600 ÷ 20 = 30 W."}
];

// القسم 1: مقدمة في علم الفيزياء (القياس والوحدات والكميات)
QB.s1 = [
{d:1,q:"فرع من فروع العلم يُعنى بدراسة الطاقة والمادة وكيفية ارتباطهما هو:",o:["الفيزياء","الكيمياء","الأحياء","الجيولوجيا"],e:"الفيزياء هي العلم الذي يدرس المادة والطاقة والعلاقة بينهما."},
{d:1,q:"النظام الدولي للوحدات يرمز له اختصارًا بالرمز:",o:["SI","MI","GI","Tr"],e:"SI اختصار Système International d'Unités."},
{d:1,q:"0.003 F تعادل:",o:["3 mF","3 dF","3 kF","3 MF"],e:"البادئة ملي (m) = 10⁻³، فـ 0.003 F = 3×10⁻³ F = 3 mF."},
{d:1,q:"أي الوحدات التالية وحدة أساسية في النظام الدولي؟",o:["الأمبير","الفولت","الأوم","التسلا"],e:"الأمبير وحدة أساسية (شدة التيار)، أما الفولت والأوم والتسلا فوحدات مشتقة."},
{d:1,q:"العبارة «الطاقة لا تفنى ولا تستحدث من العدم» تمثل:",o:["قانونًا","نظرية","فرضية","استنتاجًا"],e:"هي قانون حفظ الطاقة، والقانون وصف لعلاقة ثبتت صحتها في جميع التجارب."},
{d:1,q:"إذا كان الطول كمية أساسية فإن المساحة كمية:",o:["مشتقة","أساسية","أصلية","محايدة"],e:"المساحة = طول × طول (m²)، أي أنها مشتقة من كمية أساسية."},
{d:1,q:"أي الكميات الفيزيائية التالية كمية مشتقة؟",o:["فرق الجهد","شدة التيار","الزمن","شدة الإضاءة"],e:"فرق الجهد وحدته V = J/C = kg·m²/(A·s³)، فهي مشتقة، أما البقية فأساسية."},
{d:1,q:"أي الكميات الفيزيائية التالية تُقاس بوحدة كانديلا (cd)؟",o:["شدة الإضاءة","التدفق الضوئي","الاستضاءة","الشفافية الضوئية"],e:"الكانديلا هي وحدة شدة الإضاءة، وهي إحدى الوحدات الأساسية السبع."},
{d:1,q:"المسافة بين مدينتين 180 km، فتكون بالأمتار:",o:["1.8×10⁵ m","1.8×10³ m","1.8×10⁻¹ m","1.8×10⁸ m"],e:"1 km = 10³ m، فـ 180 km = 180×10³ = 1.8×10⁵ m."},
{d:1,q:"5 دقائق تساوي بالثواني:",o:["300 s","50 s","500 s","180 s"],e:"1 دقيقة = 60 s، فـ 5 × 60 = 300 s."},
{d:1,q:"سيارة تسير بسرعة 72 km/h، فتكون سرعتها بوحدة m/s:",o:["20","7.2","72","259"],e:"للتحويل من km/h إلى m/s نقسم على 3.6: 72 ÷ 3.6 = 20 m/s."},
{d:1,q:"4 nm تساوي بوحدة المتر:",o:["4×10⁻⁹","4×10⁻⁶","4×10⁹","4×10⁻³"],e:"البادئة نانو (n) = 10⁻⁹."},
{d:2,q:"الخطأ الناتج عن قراءة تدريج الجهاز من زاوية غير عمودية يسمى خطأ:",o:["زاوية النظر (اختلاف المنظر)","التصفير","المعايرة","الدقة"],e:"عند النظر للتدريج من زاوية مائلة تتغير القراءة ظاهريًا، ويقل الخطأ بالنظر عموديًا على التدريج."},
{d:2,q:"اتفاق نتائج القياس مع القيمة المقبولة (الحقيقية) يسمى:",o:["دقة القياس","ضبط القياس","زاوية النظر","تصفير الجهاز"],e:"الدقة (Accuracy) تعني قرب القياس من القيمة المقبولة، أما الضبط (Precision) فتقارب القياسات المتكررة من بعضها."},
{d:2,q:"مسطرة أصغر تدريج فيها 0.25 cm، فإن دقة القياس بها تساوي (نصف أصغر تدريج):",o:["0.125 cm","0.25 cm","0.05 cm","0.5 cm"],e:"دقة القياس = ½ × أصغر تدريج = 0.5 × 0.25 = 0.125 cm."},
{d:2,q:"10 s تساوي بوحدة الميكروثانية (μs):",o:["10⁷","10⁶","10⁻⁷","10⁻⁶"],e:"1 s = 10⁶ μs، فـ 10 s = 10×10⁶ = 10⁷ μs."},
{d:2,q:"سفينة حجمها 400 m³ تسير بسرعة 40 km/h نحو الجنوب الشرقي، وتتعرض لقوة إعاقة 4×10⁴ N. أي الكميات الواردة متجهة؟",o:["السرعة وقوة الإعاقة","السرعة والحجم","الكتلة والحجم","قوة الإعاقة والكتلة"],e:"السرعة المتجهة (مع اتجاه الجنوب الشرقي) والقوة كميتان متجهتان، أما الحجم والكتلة فقياسيتان."},
{d:2,q:"أي الكميات التالية كمية قياسية (عددية)؟",o:["الجهد الكهربائي","التسارع اللحظي","شدة المجال الكهربائي","شدة المجال المغناطيسي"],e:"الجهد الكهربائي كمية قياسية ليس لها اتجاه، أما المجالان والتسارع فكميات متجهة."},
{d:2,q:"العدد 0.00450 يحتوي على كم رقمًا معنويًا؟",o:["3","5","2","6"],e:"الأصفار على يسار أول رقم غير صفري لا تُحسب، أما الصفر الأخير بعد الفاصلة فمعنوي: الأرقام المعنوية هي 4 و 5 و 0، أي 3 أرقام."},
{d:3,q:"إذا كانت وحدة T تكافئ V·s/m² فأي العلاقات التالية تكافئ هذا التعريف؟",o:["m = √(V·s / T)","m = √(T / (V·s))","m² = T·V·s","m² = T / (V·s)"],e:"من T = V·s/m² نحصل على m² = V·s/T، وبأخذ الجذر التربيعي m = √(V·s/T)."}
];

// القسم 2: الميكانيكا، الحركة والمتجهات
QB.s2 = [
{d:1,q:"جسم تغيرت سرعته من 0 إلى 20 m/s خلال 4 s، فإن تسارعه يساوي:",o:["5 m/s²","80 m/s²","0.2 m/s²","16 m/s²"],e:"a = Δv / Δt = 20 ÷ 4 = 5 m/s²."},
{d:1,q:"انطلق قطار بسرعة 25 m/s وبدأ يتسارع بمقدار 10 m/s²، فكم ستكون سرعته بعد 5 s؟",o:["75 m/s","50 m/s","55 m/s","25 m/s"],e:"v = v₀ + a·t = 25 + 10×5 = 75 m/s."},
{d:1,q:"تباطأت سيارة من سرعة 30 m/s إلى 15 m/s خلال 5 s، فإن تسارعها يساوي:",o:["−3 m/s²","3 m/s²","−1.5 m/s²","15 m/s²"],e:"a = (15 − 30) ÷ 5 = −3 m/s². الإشارة السالبة تدل على التباطؤ."},
{d:1,q:"ميل منحنى (الموضع – الزمن) لجسم يتحرك على خط مستقيم يمثل:",o:["السرعة المتجهة","التسارع","الإزاحة","المسافة الكلية"],e:"الميل = Δx / Δt وهو تعريف السرعة المتجهة."},
{d:1,q:"سقط جسم سقوطًا حرًا من السكون لمدة 0.5 s، فإن سرعته لحظة الاصطدام تساوي (g = 9.8 m/s²):",o:["4.9 m/s","9.8 m/s","0.049 m/s","49 m/s"],e:"v = g·t = 9.8 × 0.5 = 4.9 m/s."},
{d:2,q:"قُذف جسم لأعلى بسرعة ابتدائية 100 m/s، فإن سرعته بعد 5 s تساوي:",o:["(100 − 5×9.8) m/s","(100 + 5×9.8) m/s","(100 + 5) m/s","5 m/s"],e:"الجاذبية تعاكس الحركة للأعلى فتتناقص السرعة: v = v₀ − g·t = 100 − 49 = 51 m/s."},
{d:2,q:"عند أقصى ارتفاع لجسم قُذف رأسيًا إلى أعلى:",o:["سرعته المتجهة صفر وتسارعه 9.8 m/s² إلى الأسفل","سرعته وتسارعه كلاهما صفر","سرعته المتجهة صفر وتسارعه صفر","سرعته 9.8 m/s وتسارعه صفر"],e:"تتوقف الحركة لحظيًا عند القمة (v = 0)، لكن الجاذبية لا تتوقف عن التأثير، فيبقى التسارع g نحو الأسفل."},
{d:2,q:"دراجة هوائية تبدأ من السكون وتتسارع بتسارع ثابت 5 m/s² لمدة 5 s، فإن المسافة التي قطعتها تساوي:",o:["62.5 m","125 m","25 m","12.5 m"],e:"d = v₀t + ½at² = 0 + 0.5 × 5 × 25 = 62.5 m."},
{d:2,q:"قُذف جسم رأسيًا لأعلى بسرعة 30 m/s، فالزمن اللازم ليعود إلى نقطة القذف يساوي (g = 10 m/s²):",o:["6 s","3 s","12 s","0.5 s"],e:"زمن الصعود = v₀/g = 3 s، وزمن العودة مثله، فالمجموع 6 s."},
{d:2,q:"تتدحرج كرة إلى أعلى منحدر بتباطؤ ثابت 2 m/s² فتتوقف بعد 4 s. المسافة التي قطعتها قبل أن تتوقف:",o:["16 m","8 m","12 m","20 m"],e:"السرعة الابتدائية v₀ = a·t = 8 m/s، والمسافة d = (v₀ + 0)/2 × t = 4 × 4 = 16 m."},
{d:2,q:"سيارة تسير بسرعة 20 m/s ضغط السائق على الفرامل فتباطأت بمقدار 4 m/s². مسافة التوقف تساوي:",o:["50 m","25 m","100 m","80 m"],e:"v² = v₀² + 2ad ⟹ 0 = 400 − 8d ⟹ d = 50 m."},
{d:2,q:"تسارعت شاحنة من السكون بمقدار 5 m/s². على أي مسافة تصبح سرعتها 10 m/s؟",o:["10 m","5 m","20 m","2 m"],e:"v² = 2ad ⟹ 100 = 2 × 5 × d ⟹ d = 10 m."},
{d:2,q:"قُذف جسم رأسيًا إلى أعلى بسرعة 20 m/s (g = 10 m/s²)، فإن أقصى ارتفاع يصل إليه يساوي:",o:["20 m","40 m","10 m","2 m"],e:"h = v₀² / 2g = 400 ÷ 20 = 20 m."},
{d:2,q:"سقط حجر من ارتفاع 80 m عن سطح الأرض، فإن سرعته لحظة اصطدامه بالأرض (g = 10 m/s²):",o:["40 m/s","80 m/s","16 m/s","160 m/s"],e:"v = √(2gh) = √(2 × 10 × 80) = √1600 = 40 m/s."},
{d:2,q:"يسحب طفل خيط طائرة ورقية بسرعة 6 m/s في اتجاه الغرب، وكانت سرعة الرياح 8 m/s في اتجاه الشمال. سرعة الطائرة تساوي:",o:["10 m/s","14 m/s","2 m/s","48 m/s"],e:"الاتجاهان متعامدان، فالمحصلة = √(6² + 8²) = √100 = 10 m/s."},
{d:2,q:"أُطلقت قذيفة بزاوية 45° مع الأفقي وبسرعة 80 m/s، فإن مركبتها الأفقية بوحدة m/s تساوي:",o:["40√2","80","80√2","40"],e:"vₓ = v·cosθ = 80 × cos45° = 80 × (√2/2) = 40√2 ≈ 56.6 m/s."},
{d:2,q:"أُطلقت قذيفة بزاوية 30° مع الأفقي بسرعة 39.2 m/s، فالزمن اللازم لتصل إلى أقصى ارتفاع (g = 9.8 m/s²):",o:["2 s","1 s","3 s","4 s"],e:"v_y = 39.2 × sin30° = 19.6 m/s، والزمن t = v_y / g = 19.6 ÷ 9.8 = 2 s."},
{d:3,q:"سيارتان A وB تتحركان في الاتجاه نفسه، A بسرعة 20 m/s وتتقدم B بمسافة 100 m، وB بسرعة 30 m/s. بعد كم ثانية تلحق B بالسيارة A؟",o:["10 s","5 s","20 s","2 s"],e:"السرعة النسبية = 30 − 20 = 10 m/s، فالزمن = 100 ÷ 10 = 10 s."},
{d:3,q:"قُذف جسم بسرعة 20 m/s بزاوية 30° مع الأفقي (g = 10 m/s²). المدى الأفقي للقذيفة يساوي تقريبًا:",o:["34.6 m","40 m","20 m","17.3 m"],e:"R = v²·sin2θ / g = 400 × sin60° ÷ 10 = 40 × 0.866 ≈ 34.6 m."},
{d:3,q:"عدّاء قطع محيط مضمار دائري طوله 400 m ورجع إلى نقطة البدء خلال 50 s. سرعته المتوسطة المتجهة تساوي:",o:["صفر","8 m/s","400 m/s","0.125 m/s"],e:"السرعة المتجهة المتوسطة = الإزاحة ÷ الزمن، والإزاحة صفر لأنه عاد لنقطة البداية، فهي صفر (أما سرعته المتوسطة القياسية فتساوي 8 m/s)."}
];

// القسم 3: الميكانيكا، القوى وقوانين نيوتن
QB.s3 = [
{d:1,q:"ينص على أن الجسم يبقى على حالته من السكون أو الحركة المنتظمة في خط مستقيم ما لم تؤثر فيه قوة تغير من حالته:",o:["قانون نيوتن الأول","قانون نيوتن الثاني","قانون نيوتن الثالث","قانون كبلر الثالث"],e:"هذا نص قانون نيوتن الأول (قانون القصور الذاتي)."},
{d:1,q:"تؤثر محصلة قوى مقدارها 20 N في جسم كتلته 5 kg، فإن تسارعه يساوي:",o:["4 m/s²","100 m/s²","0.25 m/s²","15 m/s²"],e:"a = ΣF / m = 20 ÷ 5 = 4 m/s²."},
{d:1,q:"إذا قلنا إن وزن شخص ما 200 N فأي العبارات التالية خاطئة؟",o:["كتلته تعادل 200 kg","قوة جذب الأرض له تعادل 200 N","جسمه يؤثر على الميزان بقوة مقدارها 200 N","نابض الميزان يؤثر على جسمه بقوة 200 N"],e:"الوزن قوة بوحدة N، والكتلة بوحدة kg، ولا يتساويان عدديًا: الكتلة = W/g ≈ 20.4 kg."},
{d:1,q:"أي مما يلي يمثل قوة مجال (قوة تؤثر عن بعد)؟",o:["سقوط كتاب","دفع عربة","سحب طاولة","ركل كرة"],e:"الجاذبية قوة مجال تؤثر دون تلامس، أما الدفع والسحب والركل فقوى تلامس."},
{d:2,q:"محصلة القوى المؤثرة في جسم لا تساوي صفرًا، إذا كان هذا الجسم:",o:["يسير بسرعة ثابتة في مسار دائري","في حالة اتزان حركي","في حالة اتزان سكوني","يسير بسرعة ثابتة في خط مستقيم"],e:"السرعة المتجهة تتغير باتجاهها في المسار الدائري، فهناك تسارع مركزي ومن ثم محصلة قوى لا تساوي صفرًا."},
{d:2,q:"وزن رائد فضاء على الأرض 980 N، ووزنه على كوكب آخر 490 N. فإن تسارع جاذبية ذلك الكوكب بوحدة m/s² (علمًا بأن g الأرض = 9.8 m/s²):",o:["4.9","9.8","2.45","7.35"],e:"الكتلة ثابتة = 980 ÷ 9.8 = 100 kg، فتسارع الجاذبية على الكوكب = 490 ÷ 100 = 4.9 m/s²."},
{d:2,q:"أثناء هبوط مصعد بتسارع نحو الأسفل، فإن الوزن الظاهر للراكب بالنسبة لوزنه الحقيقي:",o:["أقل","أكبر","مساوٍ","لا توجد علاقة بينهما"],e:"قوة الرد N = m(g − a) أقل من mg، فيشعر الراكب بنقصان وزنه."},
{d:2,q:"يسحب رجل صندوقًا خشبيًا كتلته 3 kg على طاولة خشبية، فإذا كان معامل الاحتكاك الحركي μₖ = 0.3 فإن قوة الاحتكاك الحركي بوحدة N (g = 10 m/s²):",o:["9","10","0.9","0.1"],e:"f = μₖ·N = μₖ·m·g = 0.3 × 3 × 10 = 9 N."},
{d:2,q:"صندوق كتلته 20 kg يستقر على سطح أفقي معامل الاحتكاك السكوني له 0.5. أكبر قوة احتكاك سكوني ممكنة (g = 10 m/s²):",o:["100 N","10 N","200 N","40 N"],e:"f_max = μₛ·m·g = 0.5 × 20 × 10 = 100 N."},
{d:2,q:"صندوق كتلته 10 kg يُسحب إلى اليمين بقوة 100 N وإلى اليسار بقوة 150 N، فإن مقدار تسارعه بوحدة m/s²:",o:["5","15","10","25"],e:"المحصلة = 150 − 100 = 50 N نحو اليسار، فـ a = 50 ÷ 10 = 5 m/s²."},
{d:2,q:"أي مجموعات القوى الأفقية التالية المؤثرة في صندوق لا تجعله يتحرك؟",o:["7 N غربًا مع 4 N شرقًا و3 N شرقًا","10 N شرقًا مع 6 N غربًا","5 N شرقًا مع 2 N غربًا","9 N غربًا مع 2 N شرقًا"],e:"يبقى الجسم ساكنًا إذا كانت المحصلة صفرًا: 4 + 3 = 7 شرقًا تعادل 7 غربًا."},
{d:2,q:"يشد حبل كتلته 0.5 kg بقوتين متعاكستين فيتحرك نحو اليمين بتسارع 2 m/s². إذا كانت القوة اليمنى 20 N فما مقدار القوة اليسرى؟",o:["19 N","21 N","22 N","10 N"],e:"ΣF = m·a = 0.5 × 2 = 1 N نحو اليمين، فـ 20 − F = 1 ⟹ F = 19 N."},
{d:2,q:"قوتان متعامدتان مقدارهما 3 N و4 N تؤثران في جسم، فإن مقدار محصلتهما:",o:["5 N","7 N","1 N","12 N"],e:"المحصلة = √(3² + 4²) = 5 N (مثلث فيثاغورس)."},
{d:2,q:"جسمان كتلتاهما 2 kg و3 kg متلامسان على سطح أملس، دُفعا بقوة أفقية 10 N. تسارع المجموعة يساوي:",o:["2 m/s²","5 m/s²","10 m/s²","0.5 m/s²"],e:"المحصلة 10 N تتحرك بها الكتلة الكلية 5 kg: a = 10 ÷ 5 = 2 m/s²."},
{d:3,q:"عند أي زاوية ميل θ تكون المركبة F_gx الموازية للسطح المائل أكبر من المركبة F_gy العمودية عليه؟",o:["60°","35°","30°","45°"],e:"F_gx = mg·sinθ و F_gy = mg·cosθ. تكون F_gx > F_gy عندما tanθ > 1 أي θ > 45°، وعند 45° بالضبط تتساويان."},
{d:3,q:"يتحرك جسم على سطح مائل أملس بزاوية 30° مع الأفقي، فإن تسارعه بوحدة m/s² (g = 9.8):",o:["4.9","9.8","8.5","19.6"],e:"a = g·sinθ = 9.8 × 0.5 = 4.9 m/s²."},
{d:3,q:"كرة مغمورة في مائع تتعرض لقوة معيقة F_d ووزنها F_g، وعندما تصل إلى سرعتها الحدية فإن:",o:["F_g = F_d","F_g > F_d","F_g < F_d","F_g = 2F_d"],e:"عند السرعة الحدية ينعدم التسارع فتكون المحصلة صفرًا، أي أن القوة المعيقة تساوي الوزن."},
{d:3,q:"مصعد كتلته 1000 kg يتسارع إلى أعلى بتسارع 2 m/s². الشد في الكابل يساوي (g = 10 m/s²):",o:["12000 N","8000 N","10000 N","2000 N"],e:"T − mg = ma ⟹ T = m(g + a) = 1000 × 12 = 12000 N."},
{d:3,q:"شخص كتلته 60 kg يقف على ميزان في مصعد يتسارع نحو الأسفل بتسارع 2 m/s². قراءة الميزان تساوي (g = 10 m/s²):",o:["480 N","720 N","600 N","120 N"],e:"mg − N = ma ⟹ N = m(g − a) = 60 × 8 = 480 N."},
{d:3,q:"كتلتان 2 kg و3 kg معلقتان بخيط يمر على بكرة ملساء. تسارع المجموعة يساوي (g = 10 m/s²):",o:["2 m/s²","10 m/s²","5 m/s²","1 m/s²"],e:"a = (m₂ − m₁)·g / (m₁ + m₂) = (3 − 2) × 10 ÷ 5 = 2 m/s²."}
];

// القسم 4: الشغل والطاقة والقدرة
QB.s4 = [
{d:1,q:"قوة مقدارها 20 N حركت جسمًا مسافة 5 m في اتجاهها، فإن الشغل المبذول يساوي:",o:["100 J","4 J","25 J","15 J"],e:"W = F·d·cosθ = 20 × 5 × 1 = 100 J."},
{d:1,q:"الطاقة الحركية لجسم كتلته 2 kg يتحرك بسرعة 10 m/s تساوي:",o:["100 J","200 J","20 J","10 J"],e:"KE = ½·m·v² = 0.5 × 2 × 100 = 100 J."},
{d:1,q:"يرفع لاعب ثقلًا كتلته 10 kg إلى ارتفاع 10 m، فما طاقة الوضع التي يكتسبها الثقل بالجول (g = 9.8 m/s²)؟",o:["980","196","98","10"],e:"PE = m·g·h = 10 × 9.8 × 10 = 980 J."},
{d:1,q:"تمثل الطاقة المختزنة في نابض مضغوط تحت كرسي:",o:["طاقة وضع مرونية","طاقة وضع جذبية","طاقة حركية","طاقة سكونية"],e:"النابض المضغوط يختزن طاقة بسبب تشوهه المرن، وتسمى طاقة الوضع المرونية."},
{d:1,q:"كلما قل الزمن اللازم لإنجاز الشغل فإن القدرة:",o:["تزداد","تقل","لا يؤثر فيها الزمن","تنعدم"],e:"P = W / t، فالقدرة تتناسب عكسيًا مع الزمن عند ثبات الشغل."},
{d:1,q:"تتناسب الطاقة الحركية لجسم طرديًا مع:",o:["مربع سرعته وكتلته","سرعته فقط","مربع كتلته","عكس مربع سرعته"],e:"KE = ½mv²، فهي تتناسب طرديًا مع الكتلة ومع مربع السرعة."},
{d:1,q:"المساحة تحت منحنى (القوة – الإزاحة) تمثل:",o:["الشغل","الدفع","القدرة","التسارع"],e:"الشغل = القوة × الإزاحة، وهو يساوي المساحة تحت منحنى القوة مع الإزاحة. أما المساحة تحت منحنى (القوة – الزمن) فتمثل الدفع."},
{d:1,q:"الطاقة الميكانيكية لجسم تساوي:",o:["مجموع طاقته الحركية وطاقة وضعه","الفرق بين طاقته الحركية وطاقة وضعه","حاصل ضرب كتلته في سرعته","طاقته الحركية فقط"],e:"الطاقة الميكانيكية E = KE + PE، وتبقى ثابتة في غياب قوى الاحتكاك ومقاومة الهواء."},
{d:2,q:"أثر شخص بقوة 55 N في صندوق ثقيل ولم يتحرك الصندوق، فإن الشغل الذي بذله على الصندوق يساوي:",o:["0","55 J","55 J مع إشارة سالبة","يعتمد على الزمن"],e:"الشغل يتطلب إزاحة (W = F·d)، ولأن d = 0 فالشغل صفر مهما كانت القوة."},
{d:2,q:"إذا بذل المحيط الخارجي شغلًا موجبًا على نظام فإن طاقة النظام:",o:["تزداد","تقل","تبقى ثابتة دائمًا","تنعدم"],e:"الشغل الموجب الذي يبذله المحيط الخارجي ينقل طاقة إلى النظام فتزداد طاقته."},
{d:2,q:"قوة 5 N تؤثر بزاوية 60° مع الأفقي في صندوق فتحركه أفقيًا مسافة 6 m. الشغل المبذول يساوي:",o:["15 J","30 J","26 J","10 J"],e:"W = F·d·cosθ = 5 × 6 × cos60° = 30 × 0.5 = 15 J."},
{d:2,q:"آلة كفاءتها 75% والشغل المبذول عليها 50 J، فإن الشغل الذي تنتجه يساوي:",o:["37.5 J","1.5 J","66.7 J","75 J"],e:"الشغل الناتج = الكفاءة × الشغل المبذول = 0.75 × 50 = 37.5 J."},
{d:2,q:"صعد أحمد السلم إلى الطابق الثاني صباحًا خلال 20 s ثم صعده مساءً خلال 22 s، فأي العبارات صحيحة؟",o:["اختلفت القدرة وبقي الشغل متساويًا","القدرة متساوية واختلف الشغل","اختلفت القدرة والشغل","القدرة والشغل صباحًا تساوي القدرة والشغل مساءً"],e:"الشغل = وزنه × الارتفاع وهو نفسه في الحالتين، أما القدرة P = W/t فتختلف لأن الزمن مختلف (الصباح أكبر قدرة)."},
{d:2,q:"عندما ترفع آلة صندوقًا مسافة 10 m فإنها تبذل شغلًا مقداره 5 كيلوجول. كتلة الصندوق بوحدة kg تساوي تقريبًا (g = 9.8 m/s²):",o:["51","16","15","48"],e:"W = m·g·h ⟹ m = 5000 ÷ (9.8 × 10) ≈ 51 kg."},
{d:2,q:"محرك كهربائي يرفع مصعدًا مسافة 5 m خلال 10 s بتأثير قوة رأسية 20000 N. القدرة التي يبذلها المحرك بوحدة kW:",o:["10","100","200","20"],e:"W = F·d = 20000 × 5 = 100000 J، و P = W/t = 10000 W = 10 kW."},
{d:2,q:"دُفع صندوق بقوة 400 N مسافة 2 m على سطح مائل إلى أعلى بالاتجاه نفسه، فإن الشغل المبذول عليه:",o:["8×10² J","4.2×10² J","6×10³ J","24×10³ J"],e:"القوة موازية للإزاحة فـ W = F·d = 400 × 2 = 800 J = 8×10² J."},
{d:3,q:"قطعة كتلتها 5 kg تتأرجح كبندول، وطاقتها 10 J عند أقصى إزاحة (طاقة وضع فقط). أقصى سرعة تبلغها عند وضع الاتزان:",o:["2 m/s","4 m/s","10 m/s","0.5 m/s"],e:"بحفظ الطاقة تتحول الـ 10 J كلها إلى طاقة حركية: ½mv² = 10 ⟹ v² = 4 ⟹ v = 2 m/s."},
{d:3,q:"رُفع جسم كتلته 10 kg إلى ارتفاع 2 m، وكانت طاقته الميكانيكية 298 J، فإن طاقته الحركية تساوي (g = 10 m/s²):",o:["98 J","9.8 J","0.98 J","980 J"],e:"PE = 10 × 10 × 2 = 200 J، وبما أن E = KE + PE فـ KE = 298 − 200 = 98 J."},
{d:3,q:"يدفع شخص صندوقًا كتلته 40 kg بسرعة ثابتة مسافة 10 m على سطح أفقي معامل احتكاكه الحركي 0.1. مقدار شغل قوة الاحتكاك بوحدة J (g = 10 m/s²):",o:["400","4000","40","4"],e:"f = μₖ·m·g = 0.1 × 40 × 10 = 40 N، والشغل = f·d = 40 × 10 = 400 J (وهو سالب الاتجاه لأنه يعاكس الحركة)."},
{d:3,q:"سيارة كتلتها 1000 kg زادت سرعتها من 10 m/s إلى 20 m/s. الشغل المبذول عليها يساوي:",o:["150000 J","100000 J","50000 J","200000 J"],e:"نظرية الشغل والطاقة: W = ΔKE = ½ × 1000 × (20² − 10²) = 500 × 300 = 150000 J."}
];

// القسم 5: الزخم والدفع، الحركة الدائرية والدورانية، الجاذبية
QB.s5 = [
{d:1,q:"قوة مقدارها 10 N تؤثر في جسم لمدة 3 s، فإن الدفع المؤثر عليه يساوي:",o:["30 N·s","13 N·s","3.3 N·s","7 N·s"],e:"الدفع J = F·Δt = 10 × 3 = 30 N·s."},
{d:1,q:"جسم كتلته 3 kg يتحرك بسرعة 4 m/s، فإن زخمه الخطي يساوي:",o:["12 kg·m/s","7 kg·m/s","0.75 kg·m/s","48 kg·m/s"],e:"p = m·v = 3 × 4 = 12 kg·m/s."},
{d:1,q:"الدفع المؤثر في جسم يساوي:",o:["التغير في زخمه","التغير في طاقته الحركية","التغير في كتلته","قدرته"],e:"نظرية الدفع والزخم: F·Δt = Δp = m·Δv."},
{d:1,q:"دراجة هوائية كتلتها 50 kg وزخمها 250 kg·m/s، فإن سرعتها تساوي:",o:["5 m/s","0.2 m/s","12500 m/s","200 m/s"],e:"v = p / m = 250 ÷ 50 = 5 m/s."},
{d:1,q:"تحرك عقرب الثواني لمدة خمس دقائق، فتكون إزاحته الزاوية:",o:["10π rad","5π rad","2π rad","2.5π rad"],e:"يكمل العقرب دورة (2π) كل دقيقة، فخلال 5 دقائق: 5 × 2π = 10π rad."},
{d:1,q:"السرعة الخطية للحافة الخارجية لإطار سيارة نصف قطره 0.5 m وسرعته الزاوية 10 rad/s:",o:["5 m/s","20 m/s","10 m/s","50 m/s"],e:"v = ω·r = 10 × 0.5 = 5 m/s."},
{d:1,q:"أثرت قوة 30 N عموديًا على باب على بعد 0.5 m من محور الدوران. عزم القوة بوحدة N·m:",o:["15","60","30","150"],e:"τ = F·r·sinθ = 30 × 0.5 × 1 = 15 N·m."},
{d:2,q:"أكمل جسم 8 دورات بثانيتين، فإن سرعته الزاوية بوحدة rad/s تساوي:",o:["8π","2π","4π","π"],e:"الدورة الواحدة 2π rad، فالإزاحة الزاوية = 8 × 2π = 16π خلال 2 s، فـ ω = 8π rad/s."},
{d:2,q:"عند دوران الأرض حول نفسها لمدة 4 ساعات، فإن الإزاحة الزاوية لها تساوي:",o:["π/3","3π","4π","π/4"],e:"الأرض تكمل 2π rad في 24 h، فخلال 4 h: (4/24) × 2π = π/3 rad."},
{d:2,q:"إذا كان التسارع الزاوي لجسم 80 rad/s² وكان r = 2 m، فإن التسارع الخطي المماسي يساوي:",o:["160 m/s²","80 m/s²","40 m/s²","45 m/s²"],e:"a = α·r = 80 × 2 = 160 m/s²."},
{d:2,q:"سيارة تدور في منعطف دائري نصف قطره 50 m بسرعة ثابتة 10 m/s، فإن تسارعها المركزي يساوي:",o:["2 m/s²","0.2 m/s²","5 m/s²","500 m/s²"],e:"a_c = v² / r = 100 ÷ 50 = 2 m/s²."},
{d:2,q:"إذا نقص نصف قطر الأرض إلى النصف مع بقاء كتلتها ثابتة، فإن قيمة g عند السطح:",o:["تزداد أربعة أضعاف","تزداد الضعف","تبقى ثابتة","تنقص إلى النصف"],e:"g = GM/r²، فعند r/2 تصبح g' = GM/(r/2)² = 4g."},
{d:2,q:"جسم وزنه W وكتلته M عند سطح الأرض. عند ارتفاعه كثيرًا عن سطح الأرض:",o:["يقل W وتبقى M ثابتة","يقل كل من M و W","يزداد كل من M و W","يقل M ويبقى W ثابتًا"],e:"الكتلة خاصية للجسم لا تتغير، أما الوزن W = mg فيقل لأن g تتناقص مع الارتفاع."},
{d:2,q:"كتلة 2 kg تتحرك بسرعة 4 m/s وتصطدم بكتلة 3 kg ساكنة، ثم يلتحمان. السرعة المشتركة بعد التصادم:",o:["1.6 m/s","2 m/s","4 m/s","0.8 m/s"],e:"حفظ الزخم: 2×4 = (2+3)·v ⟹ v = 8 ÷ 5 = 1.6 m/s."},
{d:2,q:"سيارة كتلتها 1500 kg تؤثر عليها قوة مقدارها 800 N فتحدث دفعًا مقداره 56000 N·s. الزمن اللازم لإحداث هذا الدفع:",o:["70 s","10500 s","1.42×10² s","44.8×10⁶ s"],e:"J = F·Δt ⟹ Δt = 56000 ÷ 800 = 70 s."},
{d:2,q:"سيارة كتلتها 1000 kg تتحرك من السكون بتسارع منتظم حتى تصل إلى سرعة 80 m/s، فمقدار الدفع اللازم:",o:["80000 N·s","9800 N·s","160000 N·s","100/8 N·s"],e:"J = Δp = m·(v − 0) = 1000 × 80 = 80000 N·s."},
{d:3,q:"سيارتان لهما الكتلة نفسها، الأولى تتحرك شرقًا بسرعة v والثانية ساكنة، تصادمتا والتحمتا معًا. سرعتهما بعد التصادم:",o:["½ v","¼ v","v","2v"],e:"m·v = (m + m)·v' ⟹ v' = v/2."},
{d:3,q:"أي العوامل التالية تؤثر في الزمن الدوري لكوكب يدور حول الشمس (إضافةً إلى نصف قطر المدار)؟",o:["كتلة الشمس","كتلة الكوكب","حجم الكوكب","حجم الشمس"],e:"T = 2π√(r³ / GM_sun)، فيعتمد الزمن الدوري على كتلة الشمس ونصف قطر المدار ولا يعتمد على كتلة الكوكب أو حجمه."},
{d:3,q:"حسب قانون كبلر الثالث، فإن الزمن الدوري T لكوكب حول الشمس يتناسب مع بُعده r عن الشمس وفق العلاقة:",o:["T² ∝ r³","T³ ∝ r²","T² ∝ 1/r³","T³ ∝ 1/r²"],e:"قانون كبلر الثالث: مربع الزمن الدوري يتناسب طرديًا مع مكعب متوسط البعد عن الشمس."},
{d:3,q:"يتركز العصير أثناء حركته الدورانية في خلاط كهربائي على جدار الوعاء مبتعدًا عن المركز بسبب:",o:["القصور الذاتي","القوة الطاردة المركزية الحقيقية","قوة الجذب المركزي","قوة كوريوليس"],e:"العصير يميل بحكم القصور الذاتي إلى الاستمرار في خط مستقيم (مماس المسار)، فيندفع نحو الجدار الذي يوفر القوة المركزية. والقوة الطاردة المركزية قوة ظاهرية فقط في إطار الإسناد الدوار."}
];

// القسم 6: الحرارة والديناميكا الحرارية
QB.s6 = [
{d:1,q:"كل 1 K على مقياس كلفن يعادل على مقياس السلسيوس:",o:["1 درجة","0.5 درجة","237 درجة","100 درجة"],e:"تدريج كلفن مطابق لتدريج السلسيوس في حجم الدرجة، والفرق بينهما 273 فقط في نقطة الصفر."},
{d:1,q:"درجة الحرارة 20 °C تساوي على مقياس كلفن:",o:["293 K","253 K","20 K","373 K"],e:"T(K) = T(°C) + 273 = 20 + 273 = 293 K."},
{d:1,q:"درجة حرارة المادة مقياس لـ:",o:["متوسط الطاقة الحركية لجسيماتها","مجموع طاقة جسيماتها كلها","كتلة جسيماتها","حجم المادة"],e:"درجة الحرارة تقيس متوسط الطاقة الحركية الانتقالية لجسيمات المادة، أما الطاقة الحرارية فتعتمد أيضًا على عدد الجسيمات."},
{d:1,q:"تنتقل الحرارة تلقائيًا:",o:["من الجسم الأعلى درجة حرارة إلى الأقل","من الجسم الأقل درجة حرارة إلى الأعلى","بين جسمين متساويين في الحرارة","من الجسم الأكبر كتلة إلى الأصغر دائمًا"],e:"الاتجاه التلقائي لانتقال الطاقة الحرارية دائمًا من الأسخن إلى الأبرد حتى يتحقق الاتزان الحراري."},
{d:1,q:"تنتقل حرارة الشمس إلى الأرض عبر الفراغ بواسطة:",o:["الإشعاع","التوصيل","الحمل","التبخر"],e:"التوصيل والحمل يحتاجان وسطًا ماديًا، أما الإشعاع فينتقل عبر الفراغ."},
{d:1,q:"درجة الحرارة التي تنعدم عندها (نظريًا) الطاقة الحركية لجسيمات المادة هي:",o:["الصفر المطلق (0 K)","0 °C","100 °C","273 K"],e:"الصفر المطلق = 0 K = −273.15 °C، وهو أدنى حد نظري لدرجة الحرارة."},
{d:1,q:"يعد قانون حفظ الطاقة في صيغته الحرارية:",o:["القانون الأول في الديناميكا الحرارية","القانون الثاني في الديناميكا الحرارية","قانون نيوتن الأول","قانون نيوتن الثاني"],e:"القانون الأول: ΔU = Q − W، وهو تعبير عن حفظ الطاقة في الأنظمة الحرارية."},
{d:2,q:"عندما ترتفع درجة حرارة جسم بمقدار 2 °C فإنها ترتفع على مقياسي كلفن وفهرنهايت بالترتيب:",o:["2 K و 3.6 °F","2 K و 2 °F","3.6 K و 2 °F","275 K و 32 °F"],e:"الفرق بالكلفن يساوي الفرق بالسلسيوس (2 K)، وبالفهرنهايت يساوي 1.8 × 2 = 3.6 °F."},
{d:2,q:"عند ثبات درجة الحرارة، إذا ضُغط غاز إلى نصف حجمه فإن ضغطه:",o:["يتضاعف","ينقص إلى النصف","لا يتغير","يتضاعف أربع مرات"],e:"قانون بويل: P·V = ثابت عند ثبوت T، فعند نصف الحجم يصبح الضغط ضعفين."},
{d:2,q:"إطار سيارة ضغط الهواء فيه 5 atm عند 200 K. إذا زادت درجة الحرارة إلى 300 K (والحجم ثابت) فكم يصبح الضغط؟",o:["7.5 atm","3.33 atm","1.5 atm","10 atm"],e:"قانون جاي-لوساك: P₁/T₁ = P₂/T₂ ⟹ P₂ = 5 × 300 ÷ 200 = 7.5 atm."},
{d:2,q:"يتناسب متوسط الطاقة الحركية لجسيمات الغاز مع درجة الحرارة المطلقة:",o:["طرديًا","عكسيًا","تربيعيًا عكسيًا","لا يرتبط بها"],e:"من نظرية الحركة الجزيئية: KE_avg = (3/2)·k_B·T، فهو يتناسب طرديًا مع T بالكلفن."},
{d:2,q:"كمية الحرارة اللازمة لرفع درجة حرارة 2 kg من الماء بمقدار 10 K هي (c = 4200 J/kg·K):",o:["84000 J","8400 J","420 J","42000 J"],e:"Q = m·c·ΔT = 2 × 4200 × 10 = 84000 J."},
{d:2,q:"خُلط 2 kg من الماء درجة حرارته 80 °C مع 2 kg من الماء درجة حرارته 20 °C (دون فقد حراري). درجة الحرارة النهائية:",o:["50 °C","60 °C","40 °C","100 °C"],e:"الكتلتان متساويتان ولهما الحرارة النوعية نفسها، فالنتيجة المتوسط الحسابي = (80 + 20)/2 = 50 °C."},
{d:2,q:"الحرارة الكامنة للانصهار للجليد 3.3×10⁵ J/kg. الحرارة اللازمة لصهر 0.5 kg من الجليد عند 0 °C:",o:["1.65×10⁵ J","6.6×10⁵ J","3.3×10⁵ J","1.65×10³ J"],e:"Q = m·L_f = 0.5 × 3.3×10⁵ = 1.65×10⁵ J."},
{d:2,q:"قطعة معدنية كتلتها 0.5 kg انخفضت درجة حرارتها بمقدار 20 K وفقدت طاقة حرارية مقدارها 3760 J. حرارتها النوعية بوحدة J/kg·K:",o:["376","188","752","1504"],e:"c = Q / (m·ΔT) = 3760 ÷ (0.5 × 20) = 376 J/kg·K."},
{d:2,q:"غاز امتص 500 J من الحرارة وبذل شغلًا مقداره 200 J. التغير في طاقته الداخلية:",o:["300 J","700 J","−300 J","100 J"],e:"ΔU = Q − W = 500 − 200 = 300 J."},
{d:3,q:"في عملية تسخين غاز عند حجم ثابت (isochoric) يكون:",o:["الشغل صفرًا وتساوي الحرارة المكتسبة التغير في الطاقة الداخلية","الشغل أكبر من الحرارة","التغير في الطاقة الداخلية صفرًا","الحرارة المكتسبة صفرًا"],e:"عند ثبوت الحجم لا توجد إزاحة للحدود فالشغل W = PΔV = 0، ومن القانون الأول ΔU = Q."},
{d:3,q:"قضيب فلزي طوله 2 m عند 20 °C ومعامل تمدده الطولي 1.2×10⁻⁵ K⁻¹. الزيادة في طوله عند تسخينه إلى 120 °C:",o:["2.4 mm","1.2 mm","24 mm","0.24 mm"],e:"ΔL = α·L₀·ΔT = 1.2×10⁻⁵ × 2 × 100 = 2.4×10⁻³ m = 2.4 mm."},
{d:3,q:"آلة حرارية تمتص 1000 J من مستودع ساخن وتطرد 600 J إلى مستودع بارد. كفاءتها:",o:["40%","60%","167%","400%"],e:"الشغل الناتج = 1000 − 600 = 400 J، والكفاءة = 400/1000 = 40%."},
{d:3,q:"أي العبارات التالية صحيحة وفقًا للقانون الثاني في الديناميكا الحرارية؟",o:["لا يمكن لآلة حرارية تعمل في دورة أن تحول كل الحرارة المأخوذة إلى شغل","يمكن تحويل الحرارة كلها إلى شغل بآلة كفاءتها 100%","تنتقل الحرارة تلقائيًا من الجسم البارد إلى الساخن","الإنتروبيا للنظام المعزول تنقص دائمًا"],e:"من صيغ القانون الثاني: لا بد من طرد جزء من الحرارة إلى مستودع بارد، فكفاءة الآلة الحرارية أقل من 100% دائمًا، وإنتروبيا النظام المعزول لا تنقص."}
];

// القسم 7: الكهرباء والمغناطيسية
QB.s7 = [
{d:1,q:"الشحنتان الكهربائيتان المتشابهتان:",o:["تتنافران","تتجاذبان","لا تتأثر إحداهما بالأخرى","تتعادلان دائمًا"],e:"الشحنات المتشابهة تتنافر والمختلفة تتجاذب."},
{d:1,q:"فرق جهد 12 V مطبق على مقاومة 4 Ω، فإن التيار المار فيها:",o:["3 A","48 A","0.33 A","8 A"],e:"I = V / R = 12 ÷ 4 = 3 A."},
{d:1,q:"يمر تيار شدته 2 A في موصل لمدة 10 s، فإن مقدار الشحنة المارة:",o:["20 C","5 C","0.2 C","12 C"],e:"Q = I·t = 2 × 10 = 20 C."},
{d:1,q:"مقاومتان 4 Ω و 6 Ω موصولتان على التوالي، فإن المقاومة المكافئة:",o:["10 Ω","2.4 Ω","24 Ω","5 Ω"],e:"في التوالي تُجمع المقاومات: R = 4 + 6 = 10 Ω."},
{d:1,q:"شحنة الإلكترون:",o:["سالبة ومقدارها 1.6×10⁻¹⁹ C","موجبة ومقدارها 1.6×10⁻¹⁹ C","سالبة ومقدارها 1.6×10⁻¹⁹ μC","متعادلة"],e:"الإلكترون يحمل شحنة سالبة هي الشحنة الأولية e = 1.6×10⁻¹⁹ C."},
{d:1,q:"تتجه خطوط المجال المغناطيسي خارج المغناطيس:",o:["من القطب الشمالي إلى القطب الجنوبي","من القطب الجنوبي إلى القطب الشمالي","في دوائر حول القطب الشمالي فقط","عشوائيًا"],e:"خطوط المجال تخرج من القطب الشمالي وتدخل في القطب الجنوبي (وتكمل دورتها داخل المغناطيس)."},
{d:2,q:"مصباح قدرته 60 W يعمل لمدة 5 ساعات، فإن الطاقة التي يستهلكها:",o:["0.3 kWh","300 kWh","3 kWh","0.012 kWh"],e:"E = P·t = 60 W × 5 h = 300 Wh = 0.3 kWh."},
{d:2,q:"يمر تيار 3 A في مقاومة 10 Ω، فإن القدرة المستهلكة فيها:",o:["90 W","30 W","3.3 W","300 W"],e:"P = I²·R = 9 × 10 = 90 W."},
{d:2,q:"إذا تضاعفت المسافة بين شحنتين نقطيتين فإن القوة الكهربائية بينهما:",o:["تقل إلى الربع","تقل إلى النصف","تتضاعف","تتضاعف أربع مرات"],e:"قانون كولوم: F ∝ 1/r²، فعند 2r تصبح F/4."},
{d:2,q:"مقاومتان 6 Ω و 3 Ω موصولتان على التوازي، فإن المقاومة المكافئة:",o:["2 Ω","9 Ω","4.5 Ω","18 Ω"],e:"1/R = 1/6 + 1/3 = 3/6 ⟹ R = 2 Ω (أقل من أصغر مقاومة)."},

let S=load(), V={n:'home'}, qT=Date.now();

function board(){try{return JSON.parse(localStorage.getItem(BKEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(S.student){try{const b=board();const k=S.student.name+'|'+S.student.cls;b[k]={name:S.student.name,cls:S.student.cls,pts:totalPts(),ok:totalOk(),t:Date.now()};localStorage.setItem(BKEY,JSON.stringify(b))}catch(e){}}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>Number(n).toLocaleString('ar-SA-u-nu-latn');
const stg=id=>STAGES.find(s=>s.id===id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function st(id){if(!S.stages[id]){const n=QB[id].length;S.stages[id]={perm:QB[id].map(()=>shuffle([0,1,2,3])),ans:Array(n).fill(null),cur:0,done:false}}return S.stages[id]}
const has=id=>!!S.stages[id];
function ok(id){return has(id)?S.stages[id].ans.filter(a=>a&&a.ok).length:0}
function pts(id){return has(id)?S.stages[id].ans.reduce((s,a)=>s+(a?a.p:0),0):0}
function answered(id){return has(id)?S.stages[id].ans.filter(Boolean).length:0}
function totalPts(){return STAGES.reduce((s,x)=>s+pts(x.id),0)}
function totalOk(){return STAGES.reduce((s,x)=>s+ok(x.id),0)}
function totalAns(){return STAGES.reduce((s,x)=>s+answered(x.id),0)}
function tier(p){let t=TIERS[0],nx=null;TIERS.forEach((x,i)=>{if(p>=x[0]){t=x;nx=TIERS[i+1]||null}});return{name:t[1],next:nx}}
function unlocked(i){return i===0||(has(STAGES[i-1].id)&&S.stages[STAGES[i-1].id].done)}
const doneC=()=>STAGES.filter(s=>has(s.id)&&S.stages[s.id].done).length;
function toast(m){const t=$('#toast');t.firstElementChild.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function go(n,id){V={n,id};render();window.scrollTo(0,0)}

function header(){
  return `<header class="topbar">
   <svg width="46" height="46" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="4" fill="currentColor"/><ellipse cx="24" cy="24" rx="20" ry="8" stroke="currentColor" stroke-width="2.5"/><ellipse cx="24" cy="24" rx="20" ry="8" stroke="currentColor" stroke-width="2.5" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" stroke="currentColor" stroke-width="2.5" transform="rotate(120 24 24)"/></svg>
   <div style="flex:1;min-width:220px"><h1 class="disp">منصة اختبارات تحصيلي مبكر في الفيزياء</h1>
   <p>برعاية معلم المادة <span class="teacher">${TEACHER}</span> · ${SCHOOL}<br>للتواصل: <b class="num dir-ltr">${PHONE}</b></p></div>
   ${S.student?`<div style="text-align:left" class="num"><div style="font-size:.8rem;opacity:.9">النقاط</div><div class="disp" style="font-size:1.5rem;line-height:1">${N(totalPts())}</div></div>`:''}
  </header>`}

function render(){
  const a=$('#app');
  let h=header();
  if(!S.student) h+=loginView();
  else if(V.n==='quiz') h+=quizView();
  else if(V.n==='result') h+=resultView();
  else if(V.n==='cert') h+=certView();
  else h+=homeView();
  a.innerHTML=`<div class="shell flex flex-col gap-4">${h}</div>`;
  if(V.n==='quiz'&&S.student){const s=st(V.id);if(!s.ans[s.cur])qT=Date.now()}
}

function loginView(){
  return `<form class="card flex flex-col gap-4" onsubmit="doLogin(event)" style="max-width:520px;width:100%;margin-inline:auto">
   <div><h2 class="disp" style="font-size:1.4rem;margin:0">ابدأ رحلتك نحو التحصيلي</h2>
   <p class="muted" style="margin:4px 0 0">200 سؤال متدرج من التأسيس إلى الاختبار الشامل، مع تصحيح فوري وتبرير علمي لكل إجابة.</p></div>
   <label class="flex flex-col gap-1"><span style="font-weight:600">الاسم الثلاثي</span><input id="nm" autocomplete="name" placeholder="مثال: عبدالله أحمد الحمد" required></label>
   <div id="err" class="pill bad" hidden style="border-radius:10px;padding:8px 12px"></div>
   <button class="btn btn-primary" type="submit">دخول وبدء الاختبار التشخيصي</button>
  </form>`}
function doLogin(e){e.preventDefault();
  const n=$('#nm').value.trim().replace(/\s+/g,' '), c='', er=$('#err');
  if(n.split(' ').length<3){er.textContent='اكتب اسمك ثلاثيًا (ثلاث كلمات على الأقل).';er.hidden=false;return}
  S={student:{name:n,cls:c,start:Date.now()},stages:{}};save();go('home')}

function homeView(){
  const p=totalPts(), t=tier(p), tot=200, an=totalAns();
  const dg=has('diag')&&S.stages.diag.done?Math.round(ok('diag')/20*100):null;
  const lvl=dg===null?null:dg<40?['تأسيسي','ابدأ بالأقسام بالترتيب وراجع تبريرات الإجابات جيدًا.']:dg<70?['متوسط','مستواك جيد، ركّز على الأقسام التي تقل نتيجتك فيها عن 60%.']:['متقدم','مستواك متقدم، اهتم بالأسئلة الصعبة والزمن.'];
  let cards=STAGES.map((s,i)=>{
    const u=unlocked(i), d=has(s.id)&&S.stages[s.id].done, a=answered(s.id), pc=Math.round(ok(s.id)/20*100);
    const status=d?(pc>=PASS?`<span class="pill ok">أنجزت ${N(pc)}%</span>`:`<span class="pill bad">${N(pc)}% · أعد المحاولة</span>`):a?`<span class="pill gold">قيد الحل ${N(a)}/20</span>`:u?'<span class="pill">جاهز</span>':'<span class="pill" style="background:var(--line);color:var(--muted)">مغلق</span>';
    const btn=u?`<button class="btn ${d?'':'btn-primary'}" onclick="${d?`go('result','${s.id}')`:`openStage('${s.id}')`}">${d?'عرض النتيجة':a?'متابعة':'ابدأ'}</button>`:`<button class="btn" disabled>أكمل ما قبله أولًا</button>`;
    return `<div class="card stage ${u?'':'locked'}" ${s.id==='diag'||s.id==='final'?'style="grid-column:1/-1"':''}>
      <div class="flex items-start justify-between gap-2 flex-wrap"><div style="min-width:0"><h3 class="disp" style="margin:0;font-size:1.1rem">${s.title}</h3><p class="muted" style="margin:0;font-size:.9rem">${s.desc}</p></div>${status}</div>
      <div class="bar"><i style="width:${a/20*100}%"></i></div>
      <div class="flex items-center justify-between gap-2"><span class="muted num" style="font-size:.85rem">${N(pts(s.id))} نقطة</span>${btn}</div></div>`}).join('');
  const bd=Object.values(board()).sort((a,b)=>b.pts-a.pts).slice(0,8);
  const me=S.student.name+'|'+S.student.cls;
  const lb=bd.map((r,i)=>{const mine=(r.name+'|'+r.cls)===me;return `<li class="flex items-center gap-3 num" style="padding:8px 10px;border-radius:10px;${mine?'background:var(--brand-soft);font-weight:700':''}"><span style="width:24px;text-align:center" class="muted">${N(i+1)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><span>${N(r.pts)}</span></li>`}).join('');
  const badges=STAGES.map(s=>{const d=has(s.id)&&S.stages[s.id].done&&ok(s.id)/20*100>=PASS;return badge(s,d)}).join('');
  const toNext=t.next?`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,(p-TIERS[TIERS.findIndex(x=>x[1]===t.name)][0])/(t.next[0]-TIERS[TIERS.findIndex(x=>x[1]===t.name)][0])*100)}%"></i></div><p class="muted" style="margin:4px 0 0;font-size:.85rem">تبقى ${N(t.next[0]-p)} نقطة للوصول إلى «${t.next[1]}»</p>`:'<p class="muted" style="margin:4px 0 0;font-size:.85rem">بلغت أعلى تصنيف.</p>';
  return `
  <section class="card flex flex-col gap-3">
    <div class="flex items-center justify-between gap-3 flex-wrap"><div style="min-width:0"><div style="font-weight:700;font-size:1.1rem">${esc(S.student.name)}</div></div>
      <div class="flex gap-2 flex-wrap"><span class="pill gold">التصنيف: ${t.name}</span><span class="pill num">${N(totalOk())} إجابة صحيحة</span></div></div>
    <div><div class="flex justify-between muted num" style="font-size:.85rem"><span>التقدم الكلي</span><span>${N(an)} / ${N(tot)} سؤال · المتبقي ${N(tot-an)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${an/tot*100}%"></i></div></div>
    ${lvl?`<div class="fb ok" style="border-color:var(--brand);background:var(--brand-soft)"><b>مستواك التشخيصي: ${lvl[0]} (${N(dg)}%)</b><div style="font-size:.92rem">${lvl[1]}</div></div>`:''}
  </section>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${cards}</div>
  <section class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="card"><h3 class="disp" style="margin:0 0 6px;font-size:1.1rem">لوحة الصدارة على هذا الجهاز</h3>
      <ol style="list-style:none;margin:0;padding:0">${lb||'<li class="muted">ابدأ الحل لتظهر نقاطك.</li>'}</ol>
      <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><b>تصنيفك: ${t.name}</b>${toNext}</div></div>
    <div class="card"><h3 class="disp" style="margin:0 0 8px;font-size:1.1rem">شارات الإنجاز</h3><div class="flex flex-wrap gap-3">${badges}</div>
      <p class="muted" style="font-size:.85rem;margin:10px 0 0">تُمنح الشارة عند إنهاء القسم بنسبة ${N(PASS)}% أو أكثر.</p></div>
  </section>
  <section class="card flex flex-wrap gap-2 items-center justify-between">
    <div class="flex gap-2 flex-wrap"><button class="btn btn-gold" onclick="go('result','all')">التقرير الشامل وإرساله للمعلم</button>
    ${has('final')&&S.stages.final.done?`<button class="btn btn-primary" onclick="go('cert')">شهادة التقدير</button>`:''}</div>
    <button class="btn" id="rst" onclick="resetAll()">خروج وبدء جلسة جديدة</button>
  </section>`}
function badge(s,on){
  return `<div style="width:84px;text-align:center;${on?'':'opacity:.4;filter:grayscale(1)'}"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><polygon points="28,3 51,16 51,40 28,53 5,40 5,16" fill="${on?'var(--gold-bg)':'var(--line)'}" stroke="${on?'var(--gold)':'var(--muted)'}" stroke-width="2.5"/><path d="M19 29l6 6 12-13" fill="none" stroke="${on?'var(--gold)':'var(--muted)'}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="font-size:.74rem;line-height:1.3">${s.badge}</div></div>`}
function resetAll(){const b=$('#rst');if(!b.dataset.s){b.dataset.s=1;b.textContent='اضغط مرة أخرى لحذف الجلسة الحالية';setTimeout(()=>{if(b){b.textContent='خروج وبدء جلسة جديدة';delete b.dataset.s}},4000);return}
  S={student:null,stages:{}};try{localStorage.removeItem(KEY)}catch(e){}V={n:'home'};render()}
function openStage(id){const s=st(id);if(!s.done){const f=s.ans.findIndex(a=>!a);s.cur=f<0?0:f}save();go('quiz',id)}

function quizView(){
  const id=V.id, s=st(id), Q=QB[id], i=s.cur, q=Q[i], a=s.ans[i], L=['أ','ب','ج','د'];
  const opts=s.perm[i].map((k,j)=>{
    let c='';if(a){if(k===0)c='ok';else if(j===a.sel)c='bad'}
    return `<button class="opt ${c}" ${a?'disabled':''} onclick="pick(${j})"><span class="l">${L[j]}</span><span style="min-width:0;flex:1">${q.o[k]}</span></button>`}).join('');
  const left=s.ans.filter(x=>!x).length, an=20-left;
  let fb='';
  if(a){const right=q.o[0];
    fb=a.ok?`<div class="fb ok"><b>إجابة صحيحة! +${N(a.p)} نقطة</b><div style="margin-top:4px">${q.e}</div></div>`
      :`<div class="fb bad"><b>إجابة غير صحيحة</b><div style="margin-top:4px">الإجابة الصحيحة: <b>${right}</b></div><div style="margin-top:6px"><b>التبرير العلمي:</b> ${q.e}</div></div>`}
  const dots=Q.map((_,k)=>{const x=s.ans[k];return `<button class="dot num ${x?(x.ok?'ok':'bad'):''} ${k===i?'cur':''}" aria-label="السؤال ${k+1}" onclick="jump(${k})">${N(k+1)}</button>`}).join('');
  const dl=['','سهل','متوسط','صعب'][q.d];
  return `
  <div class="flex items-center justify-between gap-2 flex-wrap"><button class="btn" onclick="go('home')">← الرئيسية</button><div class="disp" style="font-size:1.05rem;flex:1;text-align:center;min-width:180px">${stg(id).title}</div><span class="pill gold num">${N(pts(id))} نقطة</span></div>
  <div><div class="flex justify-between muted num" style="font-size:.85rem"><span>السؤال ${N(i+1)} من 20</span><span>تمت الإجابة ${N(an)} · المتبقي ${N(left)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${an/20*100}%"></i></div></div>
  <section class="card flex flex-col gap-3">
    <div class="flex gap-2"><span class="pill">${dl}</span>${id==='diag'?'':''}<span class="pill gold">${N([0,10,20,30][q.d])} نقطة أساسية</span></div>
    <h2 style="margin:0;font-size:1.15rem;line-height:1.8;font-weight:600">${q.q}</h2>
    <div class="flex flex-col gap-2">${opts}</div>
    ${fb}
    <div class="flex justify-between gap-2 flex-wrap">
      <button class="btn" ${i===0?'disabled':''} onclick="jump(${i-1})">→ السابق</button>
      ${left===0?`<button class="btn btn-primary" onclick="finish()">إنهاء القسم وعرض النتيجة</button>`:`<button class="btn" ${i===19?'disabled':''} onclick="jump(${i+1})">التالي ←</button>`}
    </div>
  </section>
  <section class="card"><div class="dots">${dots}</div></section>`}
function pick(j){const s=st(V.id),i=s.cur;if(s.ans[i])return;const q=QB[V.id][i];
  const t=(Date.now()-qT)/1000, okk=s.perm[i][j]===0;
  const base=[0,10,20,30][q.d], p=okk?Math.round(base*(1+0.5*Math.max(0,1-t/30))):0;
  s.ans[i]={sel:j,ok:okk,p,t:Math.round(t)};save();render()}
function jump(k){const s=st(V.id);if(k<0||k>19)return;s.cur=k;save();render()}
function finish(){const s=st(V.id);s.done=true;s.doneAt=Date.now();save();go('result',V.id)}

function stageLine(id){const s=stg(id),a=answered(id);if(!has(id)||!a)return `- ${s.title}: لم يبدأ`;
  const pc=Math.round(ok(id)/20*100);return `- ${s.title}: ${ok(id)}/20 (${pc}%) · ${pts(id)} نقطة${S.stages[id].done?'':' · غير مكتمل'}`}
function report(id){
  const now=new Date().toLocaleString('ar-SA',{dateStyle:'full',timeStyle:'short'});
  let l=['تقرير منصة اختبارات تحصيلي مبكر في الفيزياء',`الاسم الثلاثي: ${S.student.name}`,''];
  if(id==='all'){const tot=totalOk(),an=totalAns();
    l.push(`الدرجة الكلية: ${tot} من ${an} سؤال تمت الإجابة عنه (من أصل 200)`,`النسبة المئوية: ${an?Math.round(tot/an*100):0}%`,`النقاط المكتسبة: ${totalPts()}`,`التصنيف: ${tier(totalPts()).name}`,'','تفاصيل أداء الأقسام:',...STAGES.map(s=>stageLine(s.id)))}
  else{l.push(`الاختبار: ${stg(id).title}`,`الدرجة: ${ok(id)} من 20`,`النسبة المئوية: ${Math.round(ok(id)/20*100)}%`,`النقاط المكتسبة: ${pts(id)}`,'','تفاصيل أداء الأقسام:',...STAGES.map(s=>stageLine(s.id)))}
  l.push('',`وقت التسليم: ${now}`,`المعلم: ${TEACHER} - ${SCHOOL}`,`جوال المعلم: ${PHONE}`);return l.join('\n')}
function sendPanel(id){const r=report(id), sub=`نتيجة ${S.student.name} - ${id==='all'?'التقرير الشامل':stg(id).title}`;
  const href=`mailto:${MAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(r)}`;
  return `<section class="card flex flex-col gap-3"><h3 class="disp" style="margin:0;font-size:1.1rem">إرسال النتيجة إلى المعلم</h3>
   <textarea id="rep" readonly dir="rtl">${esc(r)}</textarea>
   <div class="flex flex-wrap gap-2 items-center"><a class="btn btn-primary" href="${href}" target="_blank" rel="noopener">إرسال النتيجة إلى البريد الإلكتروني للمعلم</a><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent(r)}" target="_blank" rel="noopener">إرسال عبر واتساب</a><button class="btn" onclick="copyRep()">نسخ التقرير</button></div>
   <p class="muted" style="margin:0;font-size:.88rem">البريد الموجّه إليه: <b class="dir-ltr" style="user-select:all">${MAIL}</b>، ورقم المعلم: <b class="dir-ltr" style="user-select:all">${PHONE}</b>. إن لم يفتح تطبيق البريد تلقائيًا، انسخ التقرير وأرسله إلى هذا العنوان.</p></section>`}
function copyRep(){const t=$('#rep');const f=()=>{t.focus();t.select();toast('تم تحديد التقرير، انسخه يدويًا')};
  try{navigator.clipboard.writeText(t.value).then(()=>toast('تم نسخ التقرير'),f)}catch(e){f()}}

function resultView(){
  const id=V.id;if(id==='all')return `<div class="flex"><button class="btn" onclick="go('home')">← الرئيسية</button></div>
   <section class="card"><h2 class="disp" style="margin:0 0 8px">التقرير الشامل</h2><div class="flex gap-2 flex-wrap"><span class="pill num">${N(totalOk())} إجابة صحيحة</span><span class="pill gold num">${N(totalPts())} نقطة</span><span class="pill">${tier(totalPts()).name}</span></div>
   <div class="flex flex-col gap-1" style="margin-top:12px">${STAGES.map(s=>`<div class="flex justify-between gap-2 num" style="border-bottom:1px solid var(--line);padding:4px 0"><span>${s.title}</span><span class="muted">${has(s.id)?N(ok(s.id))+'/20 · '+N(pts(s.id))+' ن':'—'}</span></div>`).join('')}</div></section>${sendPanel('all')}`;
  const s=stg(id), c=ok(id), pc=Math.round(c/20*100), pass=pc>=PASS, i=STAGES.indexOf(s), st_=st(id);
  const wrong=st_.ans.map((a,k)=>a&&!a.ok?k:-1).filter(k=>k>=0);
  const lvl=id==='diag'?(pc<40?'مستواك: تأسيسي. ابدأ بالأقسام بالترتيب.':pc<70?'مستواك: متوسط. ركّز على نقاط الضعف.':'مستواك: متقدم. تابع الأقسام لترسيخ المفاهيم.'):'';
  const next=STAGES[i+1];
  return `<div class="flex"><button class="btn" onclick="go('home')">← الرئيسية</button></div>
  <section class="card flex flex-col gap-3" style="text-align:center;align-items:center">
    ${badge(s,pass)}
    <h2 class="disp" style="margin:0;font-size:1.35rem">${pass?'أحسنت! نلت شارة «'+s.badge+'»':'أنهيت '+s.title}</h2>
    <div class="grid grid-cols-3 gap-3 num" style="width:100%;max-width:460px">
      <div><div class="disp" style="font-size:1.6rem">${N(c)}/20</div><div class="muted" style="font-size:.85rem">الدرجة</div></div>
      <div><div class="disp" style="font-size:1.6rem">${N(pc)}%</div><div class="muted" style="font-size:.85rem">النسبة</div></div>
      <div><div class="disp" style="font-size:1.6rem">${N(pts(id))}</div><div class="muted" style="font-size:.85rem">النقاط</div></div></div>
    ${lvl?`<p style="margin:0">${lvl}</p>`:''}
    ${pass?'':`<p class="muted" style="margin:0">النجاح يبدأ من ${N(PASS)}%. راجع الأسئلة الخاطئة ثم أعد المحاولة.</p>`}
    <div class="flex gap-2 flex-wrap justify-center">
      ${next&&pass?`<button class="btn btn-primary" onclick="openStage('${next.id}')">الانتقال إلى: ${next.title.replace(/^القسم \d+: /,'')}</button>`:''}
      ${id==='final'?`<button class="btn btn-primary" onclick="go('cert')">شهادة التقدير</button>`:''}
      <button class="btn" onclick="go('quiz','${id}');S.stages['${id}'].cur=0;render()">مراجعة الأسئلة</button>
      <button class="btn" id="rt" onclick="retry('${id}')">إعادة المحاولة</button></div>
    ${wrong.length?`<p class="muted" style="margin:0;font-size:.85rem">الأسئلة الخاطئة: ${wrong.map(k=>N(k+1)).join('، ')}</p>`:''}
  </section>${sendPanel(id)}`}
function retry(id){const b=$('#rt');if(!b.dataset.s){b.dataset.s=1;b.textContent='سيُحذف حلّك لهذا القسم، اضغط للتأكيد';return}
  delete S.stages[id];save();openStage(id)}

function certView(){
  const ac=totalOk(), p=totalPts(), pc=Math.round(ac/200*100), d=new Date().toLocaleDateString('ar-SA',{dateStyle:'long'});
  const nb=STAGES.filter(s=>has(s.id)&&S.stages[s.id].done&&ok(s.id)/20*100>=PASS).length;
  return `<div class="flex"><button class="btn" onclick="go('home')">← الرئيسية</button></div>
  <section class="cert flex flex-col gap-2 items-center">
    <div class="muted" style="letter-spacing:.08em">${SCHOOL}</div>
    <h2 class="disp" style="margin:0;font-size:1.9rem;color:var(--gold)">شهادة تقدير</h2>
    <p style="margin:0">تشهد منصة اختبارات تحصيلي مبكر في الفيزياء بأن الطالب</p>
    <div class="disp" style="font-size:1.7rem;color:var(--brand)">${esc(S.student.name)}</div>
    <p style="margin:0;max-width:520px">أتمّ مسار الأسئلة التدريجي بنتيجة ${N(ac)} من 200 (${N(pc)}%) وجمع ${N(p)} نقطة، وبلغ تصنيف «${tier(p).name}» ونال ${N(nb)} من 10 شارات.</p>
    <div class="flex items-center gap-6 flex-wrap justify-center" style="margin-top:12px"><div><div class="muted" style="font-size:.85rem">معلم المادة</div><div class="disp" style="font-size:1.3rem">${TEACHER}</div></div><div><div class="muted" style="font-size:.85rem">التاريخ</div><div>${d}</div></div></div>
  </section>${sendPanel('all')}`}

render();
</script>

</body></html>
